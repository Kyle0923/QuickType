[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quicktype"
version = "0.1.0"
description = "A lightweight keyboard-driven snippet tool with fuzzy search"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "QuickType Contributors"}
]
keywords = ["snippet", "keyboard", "fuzzy-search"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]

dependencies = [
    "keyboard>=0.13.5",
    "iterfzf>=1.9.0",
    "pystray>=0.19.0",
    "Pillow>=9.0.0",
    "pyperclip>=1.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]

[project.scripts]
quicktype = "quicktype.cli:main"

[tool.setuptools]
packages = ["quicktype"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
strict = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
addopts = "--cov=quicktype --cov-report=html --cov-report=term-missing"
testpaths = ["tests"]
minversion = "7.0"
